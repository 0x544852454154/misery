    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:#000;
    z-index:9999;
    overflow:hidden;
}
#splash-canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}
#splash-hint{
    position:absolute;
    bottom:38px;
    left:50%;
    transform:translateX(-50%);

    font-size:11px;
    letter-spacing:.22em;
    text-transform:lowercase;
    pointer-events:none;
    white-space:nowrap;

/* Non-browser / headless / view-source guard */
(function guard(){
    var ua = navigator.userAgent || "";

    var isBrowser =
        ua.indexOf("Mozilla") !== -1 &&
        (
            ua.indexOf("Chrome") !== -1 ||
            ua.indexOf("Firefox") !== -1 ||
            ua.indexOf("Safari") !== -1 ||
            ua.indexOf("Edg") !== -1
        );

    var isHeadless =
        ua.indexOf("HeadlessChrome") !== -1 ||
        ua.indexOf("PhantomJS") !== -1 ||
        ua.indexOf("Puppeteer") !== -1 ||
        ua.indexOf("Playwright") !== -1 ||
        ua.indexOf("Selenium") !== -1 ||
        navigator.webdriver === true;

    if(!isBrowser || isHeadless){
        try{ document.documentElement.innerHTML = ""; }catch(e){}
        try{ window.location.replace("about:blank"); }catch(e){}
        return;
    }

    var isViewSource = false;
    try{ isViewSource = window.location.protocol === "view-source:"; }catch(e){}
    if(!isViewSource){
        try{
            if(document.referrer && document.referrer.indexOf("view-source:") === 0){
                isViewSource = true;
            }
        }catch(e){}
    }

    var ct = "";
    try{ ct = document.contentType || ""; }catch(e){}

    if(
        isViewSource ||
        (ct && ct.indexOf("html") === -1 && ct.indexOf("xml") === -1)
    ){
        try{ document.documentElement.innerHTML = ""; }catch(e){}
        try{ window.location.replace("about:blank"); }catch(e){}
        return;
    }

    setTimeout(function(){
        if(!document.getElementById("splash-canvas")){
            try{ document.documentElement.innerHTML = ""; }catch(e){}
            try{ window.location.replace("about:blank"); }catch(e){}
        }
    }, 250);
})();

/* Anti right-click */
document.addEventListener("contextmenu", function(e){
    e.preventDefault();
    e.stopPropagation();
    return false;
}, true);

/* Anti F12 / devtools hotkeys / view-source / save / print */
document.addEventListener("keydown", function(e){
    if(e.key === "F12" || e.keyCode === 123){
        e.preventDefault();
        e.stopPropagation();
        try{ document.body.innerHTML = ""; }catch(err){}
        window.close();
        setTimeout(function(){ window.location.href = "about:blank"; }, 100);
        return false;
    }
    if(e.ctrlKey && e.shiftKey && (
        e.key === "I" || e.key === "i" ||
        e.key === "J" || e.key === "j" ||
        e.key === "C" || e.key === "c" ||
        e.key === "K" || e.key === "k"
    )){

        e.stopPropagation();
        try{ document.body.innerHTML = ""; }catch(err){}
        window.close();

    if(e.ctrlKey && (e.key === "s" || e.key === "S")){
        e.preventDefault();
        e.stopPropagation();
        return false;
    }
    if(e.ctrlKey && (e.key === "p" || e.key === "P")){
        e.preventDefault();

}, true);

/* Devtools dimension detection */
var devtoolsDetect = function(){
    var threshold = 160;
    var widthDiff = window.outerWidth - window.innerWidth;
    var heightDiff = window.outerHeight - window.innerHeight;
    if(widthDiff > threshold || heightDiff > threshold){
        try{ document.body.innerHTML = ""; }catch(e){}
        window.close();
        setTimeout(function(){ window.location.href = "about:blank"; }, 100);
    }
};
setInterval(devtoolsDetect, 500);
window.addEventListener("resize", devtoolsDetect);

/* Anti drag / select / copy / cut */

document.addEventListener("selectstart", function(e){ e.preventDefault(); return false; }, true);

/* =========================================================

"   ▀▓▌  ▐▓▒▌  ▐██▌    ▀▀▓█▌   ▀▀▄▓▄        ▀▀░▒▄▄▓▀▀      ▀▀░▒▄▄▓▀▀      ▀▓█ ▄▄█▀    ▀▓█▄   █▓▒▀",
"    ▄▀   ▄▀    ▄▀       ▄▀    ▄  ░▒▀ ▄■      ▀▀▄▀▄▄         ▀▀▄▀▄▄        ▄▀  ▄        ▀▀▀▄░▀▀▄",
"  ▐░▓▄  ▐▓▒▌  ░▓▒▄▓▄  ▐▓▓▄  ▄░▄▀   ▄░▓▄    ▄▄▒░ ▐░▓▒▄▄    ▄▄▒░ ▐░▓▒▄▄   ▐░▓▄   ░▓▄▄         ▀▓░░",
" ▄▒░░▓░  ▀▀   ▓▒░░▒  ▄▒░░▓ ▐▓░░▒▄ ▄▒░░▓▌ ▄▒░░▓▌  ▒▒░░▒▌ ▄▒░░▓▌  ▒▒░░▒▌  ▒░░▒░▄ ▓▒░░▌ ▄▄▄▄   ░▓▒░",
"▐██░██▀       ▀░░█  ▐██░█▀  ░█░█████░█░ ▐██░█░   ▀░░█▀ ▐██░█░   ▀░░█▀   ▀░██▓▀ ▐░░▓ ▐▒░░▒░▄░▒░░░",
" ▀▀             ▀    ▀▀▀▀     ▀▀▀▀▀▀▀    ▀▀▀       ▀    ▀▀▀       ▀             ▀▀   ▀▀▀▀▀▀▀▀▀▀"
];

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("splash-canvas");
const ctx = canvas.getContext("2d", {
    alpha:false,
    desynchronized:true
});

/* =========================================================
   STATE
========================================================= */

let particles = [];
let currentArt = OLD_ART;
let width = 0;
let height = 0;
let dpr = 1;
let cellW = 9;
let cellH = 15;
let mx = -9999;
let my = -9999;
let smx = -9999;
let smy = -9999;
let prevMx = -9999;
let prevMy = -9999;
let nearest = null;
let nearestDistSq = Infinity;
let t = 0;
let lastTime = performance.now();

/* =========================================================
   SETTINGS
========================================================= */

const FOLLOW_STRENGTH = 0.055;
const MOUSE_INFLUENCE = 0.12;
const MAX_FOLLOW = 120;

const DRAG_RADIUS = 150;
const DRAG_RADIUS_SQ = DRAG_RADIUS * DRAG_RADIUS;
const DRAG_STRENGTH = 0.55;

const NEIGHBOR_RADIUS = 115;
const NEIGHBOR_RADIUS_SQ = NEIGHBOR_RADIUS * NEIGHBOR_RADIUS;
const NEIGHBOR_STRENGTH = 0.10;

const SPRING_K = 0.020;
const DAMPING = 0.90;

const HUE_SPEED = 6;
const HUE_SPATIAL_SPREAD = 14;
const COLOR_SAT = 42;

/* =========================================================
   BUILD ASCII
========================================================= */

function build(art){
    const rows = art.length;
    let cols = 0;
    for(let i = 0; i < rows; i++){
        if(art[i].length > cols){
            cols = art[i].length;
        }
    }

    cellW = Math.min(
        (width * 0.80) / cols,
        (height * 0.52) / rows
    );

    cellW = Math.max(6, Math.min(cellW, 18));
    cellH = cellW * 1.65;

    const totalW = cols * cellW;
    const totalH = rows * cellH;
    const offX = (width - totalW) * 0.5;
    const offY = (height - totalH) * 0.5;

    const result = [];
    for(let row = 0; row < rows; row++){
        const line = art[row];
        for(let col = 0; col < line.length; col++){
            const ch = line[col];
            if(ch === " "){
                continue;
            }
            const x = offX + col * cellW;
            const y = offY + row * cellH;
            result.push({
                ch: ch,
                hx: x,
                hy: y,
                x: x,
                y: y,
                vx: 0,
                vy: 0,
                size: cellW * 0.85,
                phase: col * 0.018 + row * 0.31
            });
        }
    }
    return result;
}

/* =========================================================
   RESIZE
========================================================= */

function resize(){
    width = window.innerWidth;
    height = window.innerHeight;

    dpr = Math.min(window.devicePixelRatio || 1, 1.25);

    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.textAlign = "left";
    ctx.textBaseline = "top";

    particles = build(currentArt);
    ctx.font = `${cellW * 0.85}px monospace`;

    mx = width * 0.5;
    my = height * 0.5;
    smx = mx;
    smy = my;
    prevMx = mx;
    prevMy = my;
}
resize();

window.addEventListener("resize", resize, {passive:true});

/* =========================================================
   MORPH
========================================================= */

function switchASCII(){
    const oldParticles = particles;
    const newArt = currentArt === OLD_ART ? NEW_ART : OLD_ART;
    const newParticles = build(newArt);

    const oldCount = oldParticles.length;
    const newCount = newParticles.length;

    for(let i = 0; i < newCount; i++){
        const p = newParticles[i];
        const ratio = newCount <= 1 ? 0 : i / (newCount - 1);
        const oldIndex = Math.min(oldCount - 1, Math.floor(ratio * oldCount));
        const old = oldParticles[oldIndex];

        if(old){
            p.x = old.x;
            p.y = old.y;
            p.vx = old.vx * 0.15;
            p.vy = old.vy * 0.15;
            p.hxStart = old.x;
            p.hyStart = old.y;
        }else{
            p.hxStart = p.hx;
            p.hyStart = p.hy;
        }
    }

    particles = newParticles;
    currentArt = newArt;
}

/* =========================================================
   MOUSE
========================================================= */

window.addEventListener(
    "mousemove",
    function(e){
        mx = e.clientX;
        my = e.clientY;
    },
    {passive:true}
);

/* =========================================================
   CLICK
========================================================= */

let switchCooldown = false;

window.addEventListener(
    "click",
    function(){
        if(switchCooldown){
            return;
        }
        switchCooldown = true;
        switchASCII();
        setTimeout(function(){
            switchCooldown = false;
        }, 400);
    },
    {passive:true}
);

/* =========================================================
   UPDATE
========================================================= */

function update(delta){
    const frameScale = Math.min(delta / 16.6667, 2);
    t += 0.016 * frameScale;

    if(smx === -9999){
        smx = mx;
        smy = my;
        prevMx = mx;
        prevMy = my;
    }

    smx += (mx - smx) * 0.055;
    smy += (my - smy) * 0.055;

    const mvx = smx - prevMx;
    const mvy = smy - prevMy;
    prevMx = smx;
    prevMy = smy;

    const centerX = width * 0.5;
    const centerY = height * 0.5;
    const mouseOffsetX = smx - centerX;
    const mouseOffsetY = smy - centerY;

    let targetOffsetX = mouseOffsetX * MOUSE_INFLUENCE;
    let targetOffsetY = mouseOffsetY * MOUSE_INFLUENCE;

    targetOffsetX = Math.max(-MAX_FOLLOW, Math.min(MAX_FOLLOW, targetOffsetX));
    targetOffsetY = Math.max(-MAX_FOLLOW, Math.min(MAX_FOLLOW, targetOffsetY));

    nearest = null;
    nearestDistSq = Infinity;

    for(let i = 0; i < particles.length; i++){
        const p = particles[i];
        const dx = p.x - smx;
        const dy = p.y - smy;
        const distSq = dx * dx + dy * dy;
        if(distSq < nearestDistSq){
            nearestDistSq = distSq;
            nearest = p;
        }
    }

    if(nearest && nearestDistSq < DRAG_RADIUS_SQ){
        const nearestDistance = Math.sqrt(nearestDistSq);
        const dx = smx - nearest.x;
        const dy = smy - nearest.y;
        const falloff = 1 - nearestDistance / DRAG_RADIUS;
        const smooth = falloff * falloff * (3 - 2 * falloff);

        nearest.vx += dx * DRAG_STRENGTH * smooth;
        nearest.vy += dy * DRAG_STRENGTH * smooth;
        nearest.vx += mvx * 0.55 * smooth;
        nearest.vy += mvy * 0.55 * smooth;

        for(let i = 0; i < particles.length; i++){
            const p = particles[i];
            if(p === nearest){
                continue;
            }
            const dx2 = p.x - nearest.x;
            const dy2 = p.y - nearest.y;
            const d2 = dx2 * dx2 + dy2 * dy2;

            if(d2 < NEIGHBOR_RADIUS_SQ){
                const distance = Math.sqrt(d2);
                const influence = 1 - distance / NEIGHBOR_RADIUS;
                const strength = influence * influence;

                p.vx += (nearest.x - p.x) * NEIGHBOR_STRENGTH * strength;
                p.vy += (nearest.y - p.y) * NEIGHBOR_STRENGTH * strength;
                p.vx += mvx * 0.22 * strength;
                p.vy += mvy * 0.22 * strength;
            }
        }
    }

    for(let i = 0; i < particles.length; i++){
        const p = particles[i];

        const dx = p.x - smx;
        const dy = p.y - smy;
        const distanceSq = dx * dx + dy * dy;

        let smoothInfluence = 0;
        if(distanceSq < 176400){
            const distance = Math.sqrt(distanceSq);
            const influence = Math.max(0, 1 - distance / 420);
            smoothInfluence = influence * influence;
        }

        const waveX = Math.sin(t * 1.4 + p.hx * 0.018 + p.hy * 0.012) * 4;
        const waveY = Math.cos(t * 1.1 + p.hy * 0.020 + p.hx * 0.009) * 3;
        const wave2 = Math.sin(t * 0.7 + p.hx * 0.010 - p.hy * 0.015) * 2;

        const wholeFollowX = targetOffsetX * (0.35 + smoothInfluence * 0.65);
        const wholeFollowY = targetOffsetY * (0.35 + smoothInfluence * 0.65);

        let targetX = p.hx + waveX + wave2 + wholeFollowX;
        let targetY = p.hy + waveY + wholeFollowY;

        p.vx += (targetX - p.x) * SPRING_K * frameScale;
        p.vy += (targetY - p.y) * SPRING_K * frameScale;

        const damping = Math.pow(DAMPING, frameScale);
        p.vx *= damping;
        p.vy *= damping;

        p.x += p.vx * frameScale;
        p.y += p.vy * frameScale;
    }
}

/* =========================================================
   RENDER
========================================================= */

function render(){
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, width, height);

    ctx.font = `${cellW * 0.85}px monospace`;
    ctx.textAlign = "left";
    ctx.textBaseline = "top";

    const baseHue = (t * HUE_SPEED) % 360;

    for(let i = 0; i < particles.length; i++){
        const p = particles[i];

        const dx = p.x - smx;
        const dy = p.y - smy;
        const distanceSq = dx * dx + dy * dy;

        const hx = p.hx;
        const hy = p.hy;
        const ddx = p.x - hx;
        const ddy = p.y - hy;
        const displacementSq = ddx * ddx + ddy * ddy;

        const hueBend = Math.sin(hx * 0.006 + hy * 0.004 + t * 0.3) * HUE_SPATIAL_SPREAD;

        let hue = (baseHue + hueBend) % 360;
        if(hue < 0){
            hue += 360;
        }

        if(distanceSq > 18000 && displacementSq < 400){
            ctx.globalAlpha = 0.90;
            ctx.fillStyle = `hsl(${hue}, ${COLOR_SAT}%, 82%)`;
            ctx.fillText(p.ch, p.x, p.y);
            continue;
        }

        const displacement = Math.sqrt(displacementSq);
        const glow = Math.min(1, displacement / 18);
        const lightness = 60 + glow * 35;

        let scale = 1;
        if(distanceSq < 18000){
            const influence = 1 - distanceSq / 18000;
            scale += influence * 0.15;
        }

        ctx.globalAlpha = 0.86 + glow * 0.14;
        ctx.fillStyle = `hsl(${hue}, ${COLOR_SAT + glow * 15}%, ${lightness}%)`;

        if(scale > 1){
            ctx.save();
            ctx.translate(p.x + p.size * 0.5, p.y + p.size * 0.5);
            ctx.scale(scale, scale);
            ctx.fillText(p.ch, -p.size * 0.5, -p.size * 0.5);
            ctx.restore();
        }else{
            ctx.fillText(p.ch, p.x, p.y);
        }
    }
    ctx.globalAlpha = 1;
}

/* =========================================================
   ANIMATION
========================================================= */

function draw(now){
    const delta = Math.min(now - lastTime, 32);
    lastTime = now;
    update(delta);
    render();
    requestAnimationFrame(draw);
}

/* =========================================================
   AUDIO
========================================================= */

const music = document.getElementById("bgMusic");
music.volume = 1;
music.loop = true;

function startMusic(){
    const promise = music.play();
    if(promise){
        promise.catch(function(){});
    }
}

function forceLoop(){
    try {
        if(music.currentTime > 0) music.currentTime = 0;
    } catch(e){}
    startMusic();
}

music.addEventListener("ended", forceLoop);

let userPaused = false;
music.addEventListener("pause", function(){
    if(userPaused) return;
    setTimeout(function(){
        if(music.paused) forceLoop();
    }, 200);
});

setInterval(function(){
    if(music.paused && !userPaused) startMusic();
}, 1000);

window.addEventListener("load", startMusic);
document.addEventListener("click", startMusic, {once:true});
document.addEventListener("mousemove", startMusic, {once:true, passive:true});
document.addEventListener("keydown", startMusic, {once:true});

/* =========================================================
   START
========================================================= */

resize();
particles = build(OLD_ART);
requestAnimationFrame(draw);

})();
</script>
